name: Prepare release labels

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    uses: hoverkraft-tech/ci-github-publish/.github/workflows/prepare-release.yml@c3cd9bbbc4909bb341bd2aafe50a8673afc58fd0 # 3.0.6
    permissions:
      contents: read
      pull-requests: write
