# Release the prepared tag after shared CI validates packages and candidate images.
# Promotion verifies the original build/test results. Rerun all jobs after a
# promotion failure so build and validation evidence belong to the same attempt.
name: Release

on:
  # checkov:skip=CKV_GHA_7:Force selects a committed release version; it cannot change build commands or bypass package validation.
  workflow_dispatch:
    inputs:
      force:
        description: Release the package even without changes
        type: boolean
        default: false
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/prepare-package-release.yml@6dee39a2a74172ea5539caa886a12b32765d5bd1 # 3.0.3
    permissions:
      actions: write
      contents: write
      pull-requests: read
    with:
      package-directory: packages/cli
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  validate:
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      packages: write
      pull-requests: write
      security-events: write
      id-token: write
      statuses: write
      issues: write

    with:
      sign-images: true
      candidate-images: true

  promote:
    needs: validate
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-promote-images.yml@0592b66c9ed74d8cb7b0c015881ca590fc5d550b # 2.0.0
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      packages: write
      pull-requests: read
    with:
      job-results: ${{ needs.validate.outputs.job-results }}
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [prepare, validate, promote]
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/release.yml@6dee39a2a74172ea5539caa886a12b32765d5bd1 # 3.0.3
    permissions:
      actions: read
      contents: write
      pull-requests: read
      id-token: write
    with:
      packages: ${{ needs.prepare.outputs.packages }}
      package-tarball-artifact-id: ${{ needs.validate.outputs.package-tarball-artifact-id }}
    secrets:
      changelog-summary: ${{ format('{{"llmAuth":{0},"llmProvider":"openai"}}', toJSON(secrets.OPENAI_API_KEY)) }}
