---
name: Common Continuous Integration tasks

on:
  workflow_call:
    inputs:
      candidate-images:
        description: Build temporary images for release validation before promotion
        type: boolean
        default: false
      sign-images:
        required: true
        type: boolean
    outputs:
      job-results:
        description: GitHub results and outputs of all build, lint and validation jobs for image promotion
        value: ${{ toJSON(jobs) }}
      image-tag:
        description: The image tag for the CI Dokumentor CLI
        value: ${{ fromJSON(jobs.docker.outputs.built-images).cli.tags[0] }}
      package-tarball-artifact-id:
        description: The artifact ID for the package tarball
        value: ${{ jobs.nodejs.outputs.package-tarball-artifact-id }}
      build-artifact-id:
        description: The artifact ID for the build output
        value: ${{ jobs.nodejs.outputs.build-artifact-id }}

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@191d7230d57982bfc11d57f68b005f386a6d7fbf # 3.1.1
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      package: >-
        {"tests": "test \"$(ci-dokumentor --version)\" = \"$PACKAGE_VERSION\"\nci-dokumentor --help\ncd \"$GITHUB_WORKSPACE\"\nci-dokumentor generate --source
        action.yml --destination \"$RUNNER_TEMP/action.md\" --repository git --cicd github-actions --dry-run\n"}
      build: |
        {
          "commands": ["build"],
          "artifact": ["packages/docs/build", "packages/cli/dist"]
        }
      test: '{ "coverage": "codecov" }'

  docker:
    needs: [linter, nodejs]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@a5dc1ea7c1f4c2dffc3267c5be7304d01284f2ec # 4.2.1
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      candidate: ${{ inputs.candidate-images }}
      sign: ${{ inputs.sign-images }}
      images: |
        [
          {
            "name": "cli",
            "context": ".",
            "dockerfile": "docker/Dockerfile",
            "target": "production",
            "platforms": [
              "linux/amd64",
              "linux/arm64"
            ]
          }
        ]

  test-docker:
    needs: docker
    uses: $/.github/workflows/__test-docker-image.yml
    permissions:
      contents: read
      packages: read
    with:
      built-images: ${{ needs.docker.outputs.built-images }}
