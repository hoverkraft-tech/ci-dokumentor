---
name: Common Continuous Integration tasks

on:
  workflow_call:
    inputs:
      sign-images:
        required: true
        type: boolean
    outputs:
      image-tag:
        description: The image tag for the CI Dokumentor CLI
        value: ${{ fromJSON(jobs.docker.outputs.built-images).cli.tags[0] }}
      package-tarball-artifact-id:
        description: The artifact ID for the package tarball
        value: ${{ jobs.nodejs.outputs.package-tarball-artifact-id }}
      build-artifact-id:
        description: The artifact ID for the build output
        value: ${{ jobs.nodejs.outputs.build-artifact-id }}

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@f44e1bcc350b6bfe9e4a86a27b1d5e032e58f292 # 4.2.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      package: >-
        {"tests": "test \"$(ci-dokumentor --version)\" = \"$PACKAGE_VERSION\"\nci-dokumentor --help\ncd \"$GITHUB_WORKSPACE\"\nci-dokumentor generate --source
        action.yml --destination \"$RUNNER_TEMP/action.md\" --repository git --cicd github-actions --dry-run\n"}
      build: |
        {
          "commands": ["build"],
          "artifact": ["packages/docs/build", "packages/cli/dist"]
        }
      test: '{ "coverage": "codecov" }'

  docker:
    needs: [linter, nodejs]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@d6569ca423f29f68152ee561f51f7de0c08db709 # 1.0.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      sign: ${{ inputs.sign-images }}
      images: |
        [
          {
            "name": "cli",
            "context": ".",
            "dockerfile": "docker/Dockerfile",
            "target": "production",
            "platforms": [
              "linux/amd64",
              "linux/arm64"
            ]
          }
        ]

  docker-test:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ fromJSON(needs.docker.outputs.built-images).cli.images[0] }}
    steps:
      # Test version command
      - run: docker run --rm "$IMAGE" --version

      # Test help command
      - run: docker run --rm "$IMAGE" --help

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Test generate command (dry-run) on this repository's action.yml file
      - run: |
          docker run --rm \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          -u "$(id -u):$(id -g)" \
          -w "$GITHUB_WORKSPACE" \
          -e GITHUB_TOKEN \
          "$IMAGE" \
          generate \
          --source "action.yml" \
          --destination "packages/docs/content/integrations/github-action.md" \
          --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  action-test:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: generate-docs
        uses: $/
        with:
          ci-dokumentor-version: ${{ fromJSON(needs.docker.outputs.built-images).cli.tags[0] }}
          source: action.yml
          destination: packages/docs/content/integrations/github-action.md
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - env:
          GENERATED_FILE: ${{ steps.generate-docs.outputs.destination }}
        run: |
          # Assert generate-docs action outputs
          output_destination="${GENERATED_FILE}"
          expected_output_destination="packages/docs/content/integrations/github-action.md"
          if [ "$output_destination" != "$expected_output_destination" ]; then
            echo "Error: Unexpected output destination"
            exit 1
          fi
