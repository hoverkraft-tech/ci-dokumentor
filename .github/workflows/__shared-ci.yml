---
name: Common Continuous Integration tasks

on:
  workflow_call:
    inputs:
      candidate-images:
        description: Build temporary images for release validation before promotion
        type: boolean
        default: false
      sign-images:
        required: true
        type: boolean
    outputs:
      job-results:
        description: GitHub results and outputs of all build, lint and validation jobs for image promotion
        value: ${{ toJSON(jobs) }}
      image-tag:
        description: The image tag for the CI Dokumentor CLI
        value: ${{ fromJSON(jobs.docker.outputs.built-images).cli.tags[0] }}
      package-tarball-artifact-id:
        description: The artifact ID for the package tarball
        value: ${{ jobs.nodejs.outputs.package-tarball-artifact-id }}
      build-artifact-id:
        description: The artifact ID for the build output
        value: ${{ jobs.nodejs.outputs.build-artifact-id }}

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@57ec4a8bf0ab9ea52beea725b5e59895ed39f4f2 # PR #683 (unreleased)
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  nodejs:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@277d184953d7a515fe4271eb0532eebc53d6e214 # PR #624 (unreleased)
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
      actions: read
    with:
      package: >-
        {"tests": "test \"$(ci-dokumentor --version)\" = \"$PACKAGE_VERSION\"\nci-dokumentor --help\ncd \"$GITHUB_WORKSPACE\"\nci-dokumentor generate --source
        action.yml --destination \"$RUNNER_TEMP/action.md\" --repository git --cicd github-actions --dry-run\n"}
      build: |-
        {"commands":["build"],"artifact":["packages/docs/build","packages/**/dist"]}

  docker:
    needs: [linter, nodejs]
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      candidate: ${{ inputs.candidate-images }}
      sign: ${{ inputs.sign-images }}
      images: |
        [
          {
            "name": "cli",
            "context": ".",
            "dockerfile": "docker/Dockerfile",
            "target": "production",
            "platforms": [
              "linux/amd64",
              "linux/arm64"
            ]
          }
        ]

  test-docker:
    needs: docker
    uses: $/.github/workflows/__test-docker-image.yml
    permissions:
      contents: read
      packages: read
    with:
      built-images: ${{ needs.docker.outputs.built-images }}

  reports:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@57ec4a8bf0ab9ea52beea725b5e59895ed39f4f2 # PR #683 (unreleased)
    if: ${{ !cancelled() }}
    needs:
      - linter
      - nodejs
      - docker
      - test-docker
    permissions:
      actions: read
      contents: read
      pull-requests: write
      code-quality: write
      id-token: write
      security-events: write
    with:
      job-results: ${{ toJSON(needs) }}
      test-coverage-reporters: |
        auto
        codecov
